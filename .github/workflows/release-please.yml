name: Release Please

# Opens/updates a release PR from Conventional Commits on main. Merging that PR
# creates the tag and GitHub release (the package version itself comes from the
# git tag via setuptools_scm) and then publishes to PyPI.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Releases created with GITHUB_TOKEN do not trigger the `release: published`
  # event, so publish from here instead of relying on release.yml's own trigger.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

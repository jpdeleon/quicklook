name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Lightkurve data
        uses: actions/cache@v6
        with:
          path: ~/.lightkurve/cache/mastDownload
          key: ${{ runner.os }}-lightkurve-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-lightkurve-

      - name: Remove corrupted FITS (if any)
        run: |
          find ~/.lightkurve/cache/mastDownload -type f -name "*.fits" -size -1M -delete || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"

      - name: Run tests
        run: pytest -v -m "not notebook and not network" -n auto

      - name: Verify package builds cleanly
        run: |
          pip install --upgrade build
          python -m build --sdist --wheel
